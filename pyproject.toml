[project]
name = "mathqed"
version = "0.1.0"
description = "Sistema de Gestión de Tareas - SIGE"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "flet>=0.82.2",
    "httpx",
    "itsdangerous",
    "mysql-connector-python>=9.6.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "sympy>=1.12",
    "setuptools>=79.0.0",
]

[build-system]
requires = ["setuptools>=79.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
app = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["src"]

[tool.setuptools.package-data]
src = ["**/*"]